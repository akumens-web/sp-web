name: Build static hosting package
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public HTTPS origin (for example https://patrol.example)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: shawarma-patrol-static
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
